<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>እናና፣ ሱዚ፣ ቤዛ እና ተስፋነሽ – ቡና</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b1a10; --cream:#f7efe2; }
  * { box-sizing:border-box; }
  body { margin:0; background:#2a1a10; color:#fff;
         font:16px/1.6 "Noto Sans Ethiopic", system-ui, sans-serif; }
  .stage { position:relative; max-width:1100px; margin:0 auto; }
  svg { display:block; width:100%; height:auto; }

  /* Speech bubble: positioned above whichever girl is talking */
  #bubble { position:absolute; top:1.5%; width:min(34%, 340px); transform:translateX(-50%);
    background:#fffdf8; color:var(--ink); padding:10px 14px 12px; border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:opacity .3s, left .4s;
    pointer-events:none; font-size:clamp(13px,1.7vw,17px); }
  #bubble.show { opacity:1; }
  #bubble b { display:block; font-size:.8em; margin-bottom:2px; }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
    border:10px solid transparent; border-top-color:#fffdf8; border-bottom:0; }

  .controls { display:flex; align-items:center; gap:16px; max-width:1100px; margin:0 auto; padding:14px 12px 6px; }
  #micBtn { flex:none; font:600 18px/1 "Noto Sans Ethiopic", system-ui, sans-serif; color:#fff; background:#1f7a3a;
            border:0; border-radius:999px; padding:16px 26px; min-height:56px; cursor:pointer; }
  #micBtn.on { background:#b3202b; animation:pulse 1.4s ease-in-out infinite; }
  #micBtn:focus-visible { outline:3px solid #e3b23c; outline-offset:3px; }
  #micBtn:disabled { background:#555; cursor:not-allowed; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(227,178,60,.7); } 50% { box-shadow:0 0 0 10px rgba(227,178,60,0); } }
  #wave { flex:1; width:100%; height:64px; display:block; }
  .status { max-width:1100px; margin:0 auto; padding:0 12px 18px; color:#e9c38f; font-size:14px; }

  /* ---------- Animations ---------- */
  .girl .spot { opacity:0; transition:opacity .5s; }
  .girl.active .spot { opacity:1; }
  .girl .label { fill:#7a5a40; transition:fill .3s; }
  .girl.active .label { fill:#b3202b; font-weight:700; }

  .girl .body { transform-box:fill-box; transform-origin:center bottom; animation:breathe 4.5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform:scaleY(1.008); } }

  .girl .head { transform-box:fill-box; transform-origin:50% 90%; animation:sway 6s ease-in-out infinite; }
  .girl.active .head { animation:talkSway 1.6s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform:rotate(-1.5deg); } 50% { transform:rotate(1.5deg); } }
  @keyframes talkSway { 0%,100% { transform:rotate(-3deg); } 50% { transform:rotate(2.5deg) translateY(-1px); } }

  .eye { transform-box:fill-box; transform-origin:center; animation:blink 5s infinite; }
  @keyframes blink { 0%,95%,100% { transform:scaleY(1); } 97.5% { transform:scaleY(.08); } }

  .smoke { fill:none; stroke:#fff; stroke-width:3.5; stroke-linecap:round; opacity:0; animation:smoke 4s ease-out infinite; }
  @keyframes smoke { 0% { opacity:0; transform:translateY(0) scale(.8); } 25% { opacity:.6; } 100% { opacity:0; transform:translateY(-80px) scale(1.5); } }

  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
</head>
<body>

<div class="stage">
  <svg id="scene" viewBox="0 0 1000 700" role="img" aria-label="Four friends in habesha kemis at an Ethiopian coffee ceremony">
    <defs id="defs">
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fbf5ea"/><stop offset=".75" stop-color="#f1e4cf"/><stop offset="1" stop-color="#e8d6bb"/>
      </linearGradient>
      <radialGradient id="glow" cx=".5" cy=".35" r=".7">
        <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="spot" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#f6d27a" stop-opacity=".55"/><stop offset="1" stop-color="#f6d27a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#e6dccb"/><stop offset=".3" stop-color="#fffdf8"/>
        <stop offset=".7" stop-color="#fffdf8"/><stop offset="1" stop-color="#e2d7c4"/>
      </linearGradient>
      <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7a4a2b"/><stop offset="1" stop-color="#4a2a16"/>
      </linearGradient>
      <radialGradient id="clay" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#7a5038"/><stop offset=".6" stop-color="#3d2618"/><stop offset="1" stop-color="#1e120a"/>
      </radialGradient>
      <radialGradient id="gold" cx=".35" cy=".35" r=".7">
        <stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#e3b23c"/><stop offset="1" stop-color="#a87a1a"/>
      </radialGradient>
      <!-- Woven rug border -->
      <pattern id="rugBand" width="24" height="14" patternUnits="userSpaceOnUse">
        <rect width="24" height="14" fill="#b3202b"/><path d="M0 7 L6 1 L12 7 L18 1 L24 7 L18 13 L12 7 L6 13 Z" fill="#e3b23c"/>
      </pattern>
    </defs>

    <!-- Room -->
    <rect width="1000" height="700" fill="url(#wall)"/>
    <ellipse cx="500" cy="260" rx="520" ry="300" fill="url(#glow)"/>
    <path d="M0 470 Q500 440 1000 470 L1000 700 L0 700 Z" fill="#efe3cf"/>
    <!-- Rug -->
    <path d="M90 556 Q500 532 910 556 L950 696 L50 696 Z" fill="#f8f1e4"/>
    <path d="M90 556 Q500 532 910 556" stroke="url(#rugBand)" stroke-width="10" fill="none"/>
    <path d="M50 696 L950 696" stroke="url(#rugBand)" stroke-width="10"/>
    <!-- Fresh grass (ketema), filled by script -->
    <g id="grass"></g>

    <!-- The four girls are drawn here by script -->
    <g id="girls"></g>

    <!-- Coffee table -->
    <g id="table">
      <ellipse cx="500" cy="682" rx="170" ry="12" fill="#000" opacity=".12"/>
      <rect x="380" y="600" width="22" height="78" rx="6" fill="#4a2a16"/>
      <rect x="598" y="600" width="22" height="78" rx="6" fill="#4a2a16"/>
      <rect x="489" y="610" width="22" height="72" rx="6" fill="#3d2212"/>
      <path d="M345 582 L345 604 Q500 640 655 604 L655 582 Z" fill="url(#wood)"/>
      <path d="M350 598 Q500 630 650 598" stroke="#9a6a3c" stroke-width="2" stroke-dasharray="10 6" fill="none"/>
      <ellipse cx="500" cy="582" rx="155" ry="30" fill="#8a5632"/>
      <ellipse cx="500" cy="580" rx="140" ry="24" fill="#9b6439" stroke="#6b3f22" stroke-width="2"/>
      <!-- Tray -->
      <ellipse cx="545" cy="586" rx="92" ry="13" fill="url(#gold)" opacity=".9"/>
      <g id="cups"></g>
      <!-- Jebena -->
      <g id="jebena">
        <path d="M430 542 Q404 540 410 568 Q414 584 430 584" fill="none" stroke="#2a1a10" stroke-width="7" stroke-linecap="round"/>
        <rect x="446" y="500" width="22" height="48" rx="7" fill="url(#clay)"/>
        <ellipse cx="457" cy="500" rx="15" ry="5" fill="#3d2618"/>
        <path d="M450 496 Q457 478 464 496" fill="#d9b04c"/> <!-- straw stopper -->
        <path d="M482 560 Q500 548 512 526 L517 530 Q508 554 488 574 Z" fill="#2a1a10"/>
        <circle cx="457" cy="572" r="32" fill="url(#clay)"/>
        <path d="M428 572 Q457 590 486 572" stroke="#c9963a" stroke-width="2" fill="none"/>
        <path d="M432 562 Q457 576 482 562" stroke="#c9963a" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
        <ellipse cx="446" cy="560" rx="7" ry="10" fill="#fff" opacity=".12"/>
        <path class="smoke" d="M514 522 q-6 -12 0 -24 q6 -12 0 -24"/>
        <path class="smoke" style="animation-delay:2s" d="M514 522 q6 -12 0 -24 q-6 -12 0 -24"/>
      </g>
      <!-- Incense burner (etan) -->
      <g transform="translate(622,560)">
        <path d="M0 6 L26 6 L21 32 L5 32 Z" fill="#8a4424"/>
        <circle cx="9" cy="18" r="2.4" fill="#2a1a10"/><circle cx="17" cy="18" r="2.4" fill="#2a1a10"/>
        <ellipse cx="13" cy="6" rx="13" ry="4" fill="#5a2a14"/>
        <circle cx="10" cy="5" r="2.5" fill="#ff8a2a"/><circle cx="16" cy="5" r="2" fill="#ffb347"/>
        <path class="smoke" d="M12 2 q-8 -14 0 -28 q8 -14 0 -28"/>
        <path class="smoke" style="animation-delay:1.3s" d="M14 2 q8 -14 0 -28 q-8 -14 0 -28"/>
        <path class="smoke" style="animation-delay:2.6s" d="M13 2 q-5 -14 3 -28 q6 -14 -2 -28"/>
      </g>
    </g>
  </svg>

  <div id="bubble" aria-live="polite"><b id="bubbleName"></b><span id="bubbleText"></span></div>
</div>

<div class="controls">
  <button type="button" id="micBtn" aria-pressed="false">▶ ጀምር · Start</button>
  <canvas id="wave" aria-hidden="true"></canvas>
</div>
<p id="status" class="status">ጀምርን ይጫኑ፣ ከዚያ ስም ጠርተው ይናገሩ — “እናና…”፣ “ቤዛ…” ወይም ሁላችሁም። (Press Start, then call a name — live, like Gemini.)</p>

<script>
{
  const NS = "http://www.w3.org/2000/svg";

  /* ================= THE FOUR GIRLS ================= */
  // Order = speaking order. Visual style only; voices live in server.js.
  const GIRLS = [
    { id:"enana",     am:"እናና",   en:"Enana",     x:150, color:"#b3202b", hair:"afro",   skin:"#9a6142" },
    { id:"suzi",      am:"ሱዚ",    en:"Suzi",      x:385, color:"#1f7a3a", hair:"braids", skin:"#8a5536" },
    { id:"beza",      am:"ቤዛ",    en:"Beza",      x:615, color:"#1f4fa8", hair:"updo",   skin:"#a26c4a" },
    { id:"tesfanesh", am:"ተስፋነሽ", en:"Tesfanesh", x:850, color:"#6d2a7a", hair:"curly",  skin:"#93593a" },
  ];
  const HIP_Y = 390;            // where each girl sits
  const HAIR = "#1a100a", HAIR_HI = "#3a2618";

  // Small helpers to build SVG strings
  const rnd = (a, b) => a + Math.random() * (b - a);
  function darken(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const c = s => Math.round(((n >> s) & 255) * f).toString(16).padStart(2, "0");
    return "#" + c(16) + c(8) + c(0);
  }

  // Tibeb pattern (woven border) in each girl's colour
  function tibeb(g) {
    return `<pattern id="tb-${g.id}" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="${g.color}"/>
      <rect width="18" height="2" fill="#f3dc9a"/><rect y="16" width="18" height="2" fill="#f3dc9a"/>
      <path d="M9 3 L15 9 L9 15 L3 9 Z" fill="#e3b23c"/>
      <path d="M9 6.5v5M6.5 9h5" stroke="${g.color}" stroke-width="1.6"/>
    </pattern>`;
  }

  /* ---- Hair styles (drawn behind the body, and in front of the head) ---- */
  function hairBack(g) {
    let s = "";
    if (g.hair === "afro") {
      for (let i = 0; i < 46; i++) {
        const a = (i / 46) * Math.PI * 2, r = rnd(36, 52);
        s += `<circle cx="${Math.cos(a) * r}" cy="${-190 + Math.sin(a) * r * .95}" r="${rnd(14, 20)}" fill="${HAIR}"/>`;
      }
      s += `<circle cx="0" cy="-190" r="44" fill="${HAIR}"/>`;
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2, r = rnd(20, 66);
        s += `<path d="M${Math.cos(a) * r} ${-190 + Math.sin(a) * r} a4 4 0 1 1 5 3" stroke="${HAIR_HI}" stroke-width="1.6" fill="none"/>`;
      }
    }
    if (g.hair === "braids" || g.hair === "updo")
      s += `<ellipse cx="0" cy="-182" rx="26" ry="25" fill="${HAIR}"/>`;
    if (g.hair === "braids") {
      for (let i = 0; i < 16; i++) {
        const sx = -20 + i * 2.7, ex = -48 + i * 6.4, ey = rnd(-20, 30);
        const d = `M${sx} -186 Q${sx * 1.9} -110 ${ex} ${ey}`;
        s += `<path d="${d}" stroke="${HAIR}" stroke-width="6" fill="none" stroke-linecap="round"/>
              <path d="${d}" stroke="${HAIR_HI}" stroke-width="2" stroke-dasharray="3 3" fill="none"/>`;
      }
    }
    if (g.hair === "curly") {
      s += `<path d="M-30 -205 Q-70 -150 -62 -60 Q-66 0 -40 30 Q0 44 40 30 Q66 0 62 -60 Q70 -150 30 -205 Q0 -222 -30 -205Z" fill="${HAIR}"/>`;
      for (let i = 0; i < 56; i++) {
        const side = i % 2 ? 1 : -1, y = rnd(-175, 15), x = side * rnd(28, y < -140 ? 40 : 54);
        s += `<path d="M${x} ${y} q${side * 5} 4 0 8 q${-side * 5} 4 0 8" stroke="${HAIR_HI}" stroke-width="1.8" fill="none"/>`;
      }
    }
    return s;
  }
  function hairFront(g) {
    // Hairline cap, used by all styles
    let s = `<path d="M-24 -172 Q-28 -204 0 -203 Q28 -204 24 -172 Q19 -192 0 -194 Q-19 -192 -24 -172Z" fill="${HAIR}"/>`;
    if (g.hair === "braids" || g.hair === "updo") {
      for (let i = -3; i <= 3; i++)        // cornrows (shuruba)
        s += `<path d="M${i * 5} -194 Q${i * 6} -200 ${i * 4} -206" stroke="${HAIR_HI}" stroke-width="1.6" stroke-dasharray="2 2" fill="none"/>`;
    }
    if (g.hair === "updo") {
      s += `<circle cx="0" cy="-218" r="21" fill="${HAIR}"/>
            <path d="M0 -218 m-14 0 a14 14 0 1 1 14 14 a9 9 0 1 1 -9 -9 a5 5 0 1 1 5 5" stroke="${HAIR_HI}" stroke-width="2" fill="none"/>
            <path d="M-23 -176 q-5 8 0 14 q5 7 -1 14 q-5 7 1 13" stroke="${HAIR}" stroke-width="2.5" fill="none"/>
            <path d="M23 -176 q5 8 0 14 q-5 7 1 14 q5 7 -1 13" stroke="${HAIR}" stroke-width="2.5" fill="none"/>`;
    }
    if (g.hair === "afro" || g.hair === "curly") {
      for (let i = -4; i <= 4; i++)
        s += `<circle cx="${i * 5.5}" cy="${-198 + Math.abs(i) * 2.2}" r="6" fill="${HAIR}"/>`;
    }
    return s;
  }

  /* ---- One girl, drawn around her hip point ---- */
  function girlSVG(g) {
    const tb = `url(#tb-${g.id})`, sk = g.skin, skD = darken(g.skin, .78);
    const netela = g.id === "suzi";   // one girl wears a netela shawl
    return `
    <g class="girl" id="g-${g.id}" transform="translate(${g.x},${HIP_Y})">
      <ellipse class="spot" cx="0" cy="-60" rx="125" ry="210" fill="url(#spot)"/>
      ${hairBack(g)}
      <!-- cushion -->
      <ellipse cx="0" cy="108" rx="115" ry="14" fill="#000" opacity=".08"/>
      <path d="M-112 84 Q-114 60 -90 58 L90 58 Q114 60 112 84 Q114 106 90 108 L-90 108 Q-114 106 -112 84Z" fill="#fdfaf4" stroke="#e2d8c6"/>
      <path d="M-100 70 Q0 64 100 70" stroke="#ece3d3" stroke-width="2" fill="none"/>
      <g class="body">
        <!-- skirt -->
        <path d="M-50 -12 Q-92 36 -104 94 Q0 114 104 94 Q92 36 50 -12 Z" fill="url(#cloth)" stroke="#d6cbb8"/>
        <path d="M-30 12 Q-46 52 -54 96 M30 12 Q44 52 52 97 M-62 40 Q-74 70 -80 98 M62 40 Q74 70 80 98" stroke="#e5dccc" stroke-width="2" fill="none"/>
        <path d="M-103 86 Q0 106 103 86" stroke="${tb}" stroke-width="18" fill="none"/>
        <path d="M-11 -12 L11 -12 L16 100 L-16 100Z" fill="${tb}"/>
        <!-- torso -->
        <path d="M-38 -110 Q0 -118 38 -110 L50 -12 Q0 -2 -50 -12Z" fill="url(#cloth)" stroke="#d6cbb8"/>
        <path d="M-9 -86 L9 -86 L11 -12 L-11 -12Z" fill="${tb}"/>
        <rect x="-50" y="-26" width="100" height="11" rx="3" fill="${tb}"/>
        <!-- neck + V neckline -->
        <path d="M-8 -142 L8 -142 L21 -112 L0 -86 L-21 -112Z" fill="${sk}"/>
        <path d="M-7 -142 L7 -142 L7 -130 Q0 -126 -7 -130Z" fill="${skD}" opacity=".5"/>
        <path d="M-23 -112 L0 -84 L23 -112" stroke="${tb}" stroke-width="8" fill="none" stroke-linejoin="round"/>
        <!-- necklace with gold cross -->
        <path d="M-13 -124 Q0 -104 13 -124" stroke="#d9a72c" stroke-width="1.4" fill="none"/>
        <g transform="translate(0,-103)"><path d="M0 -6v12M-5 -1h10" stroke="#e3b23c" stroke-width="3.2" stroke-linecap="round"/><circle r="1.8" fill="#fff1b8"/></g>
        ${netela ? `<path d="M30 -110 Q70 -80 74 -10 Q78 40 64 70 L40 66 Q54 20 44 -40 Q38 -80 18 -106Z" fill="#fbf7ee" stroke="#e0d6c3"/>
                    <path d="M64 70 L40 66" stroke="${tb}" stroke-width="8"/>
                    <path d="M42 70 v8 M48 71 v8 M54 72 v8 M60 72 v8" stroke="#e0d6c3" stroke-width="1.5"/>` : ""}
        <!-- sleeves + hands in lap -->
        <path d="M-36 -106 Q-68 -60 -68 4 Q-68 22 -52 30 L-22 30 Q-34 -30 -20 -96Z" fill="url(#cloth)" stroke="#d6cbb8"/>
        <path d="M36 -106 Q68 -60 68 4 Q68 22 52 30 L22 30 Q34 -30 20 -96Z" fill="url(#cloth)" stroke="#d6cbb8"/>
        <path d="M-66 14 Q-44 27 -22 22" stroke="${tb}" stroke-width="11" fill="none"/>
        <path d="M66 14 Q44 27 22 22" stroke="${tb}" stroke-width="11" fill="none"/>
        <path d="M-34 30 Q-20 22 2 36 Q-6 46 -22 44 Q-34 42 -34 30Z" fill="${sk}"/>
        <path d="M34 30 Q20 22 -2 36 Q6 46 22 44 Q34 42 34 30Z" fill="${sk}" stroke="${skD}" stroke-width="1"/>
      </g>
      <!-- head -->
      <g class="head">
        <ellipse cx="-22" cy="-168" rx="4" ry="6" fill="${skD}"/><ellipse cx="22" cy="-168" rx="4" ry="6" fill="${skD}"/>
        <ellipse cx="0" cy="-168" rx="22" ry="28" fill="${sk}"/>
        <path d="M6 -195 Q24 -184 20 -160 Q14 -142 0 -140 Q14 -152 14 -170 Q14 -186 6 -195Z" fill="${skD}" opacity=".35"/>
        <!-- gold coin earrings -->
        <circle cx="-24" cy="-151" r="7" fill="url(#gold)"/><circle cx="-24" cy="-151" r="3.5" fill="none" stroke="#a87a1a"/>
        <circle cx="24" cy="-151" r="7" fill="url(#gold)"/><circle cx="24" cy="-151" r="3.5" fill="none" stroke="#a87a1a"/>
        <!-- brows -->
        <path d="M-14 -178 Q-9 -181.5 -3 -178.5 M3 -178.5 Q9 -181.5 14 -178" stroke="${HAIR}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- eyes -->
        <g class="eye" style="animation-delay:${rnd(0, 4).toFixed(2)}s">
          <path d="M-14 -170 Q-8.5 -175 -3 -170 Q-8.5 -166 -14 -170Z" fill="#fff"/>
          <circle cx="-8.5" cy="-170.3" r="2.7" fill="#2a160c"/><circle cx="-7.7" cy="-171.1" r=".8" fill="#fff"/>
          <path d="M-14.8 -170.3 Q-8.5 -176.2 -2.4 -170.6 M-14.8 -170.3 l-2 -1.6" stroke="#140a05" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </g>
        <g class="eye" style="animation-delay:${rnd(0, 4).toFixed(2)}s">
          <path d="M14 -170 Q8.5 -175 3 -170 Q8.5 -166 14 -170Z" fill="#fff"/>
          <circle cx="8.5" cy="-170.3" r="2.7" fill="#2a160c"/><circle cx="9.3" cy="-171.1" r=".8" fill="#fff"/>
          <path d="M14.8 -170.3 Q8.5 -176.2 2.4 -170.6 M14.8 -170.3 l2 -1.6" stroke="#140a05" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </g>
        <!-- nose, cheeks -->
        <path d="M0.5 -166 Q-1.8 -158 0 -156.5 Q2.5 -156 3.5 -157.5" stroke="${skD}" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <circle cx="-13" cy="-158" r="4.5" fill="#d9776a" opacity=".22"/><circle cx="13" cy="-158" r="4.5" fill="#d9776a" opacity=".22"/>
        <!-- mouth: closed lips + open mouth (for talking) -->
        <g class="lips">
          <path d="M-6.5 -149 Q-3 -151.8 0 -150.3 Q3 -151.8 6.5 -149 Q0 -147.6 -6.5 -149Z" fill="#7c3530"/>
          <path d="M-6.5 -149 Q0 -143.8 6.5 -149 Q0 -147.6 -6.5 -149Z" fill="#94463e"/>
        </g>
        <g class="openMouth" opacity="0">
          <ellipse class="mo" cx="0" cy="-148.5" rx="5.5" ry="3" fill="#3a1210" stroke="#8a3e36" stroke-width="1.6"/>
          <rect x="-3.5" y="-151" width="7" height="1.6" rx=".8" fill="#fff" opacity=".85"/>
        </g>
        ${hairFront(g)}
      </g>
      <text class="label" x="0" y="134" text-anchor="middle" font-size="17">${g.am} · ${g.en}</text>
    </g>`;
  }

  // Draw everything
  document.getElementById("defs").insertAdjacentHTML("beforeend", GIRLS.map(tibeb).join(""));
  document.getElementById("girls").innerHTML = GIRLS.map(girlSVG).join("");

  // Cups on the tray, each with a little steam
  document.getElementById("cups").innerHTML = [500, 535, 570, 605].map((x, i) => `
    <ellipse cx="${x}" cy="590" rx="14" ry="4" fill="#f4efe6" stroke="#d8cfbf"/>
    <path d="M${x - 11} 574 L${x + 11} 574 L${x + 7} 589 L${x - 7} 589 Z" fill="#fff" stroke="#d8cfbf"/>
    <ellipse cx="${x}" cy="574" rx="11" ry="3" fill="#3b1f0e"/>
    <path d="M${x - 9} 580 h18" stroke="#b3202b" stroke-width="1.6"/>
    <path class="smoke" style="animation-delay:${i * .9}s;stroke-width:2" d="M${x} 570 q-4 -8 0 -16 q4 -8 0 -16"/>`).join("");

  // Fresh grass on the rug
  let grass = "";
  for (let i = 0; i < 46; i++) {
    const x = i % 2 ? rnd(140, 340) : rnd(660, 860), y = rnd(600, 680), h = rnd(7, 12);
    grass += `<path d="M${x} ${y} q${rnd(-5, 5)} ${-h / 2} ${rnd(-6, 6)} ${-h}" stroke="${i % 2 ? "#3f8f3a" : "#5bb04a"}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  }
  // (grass removed for a cleaner look)


  /* ================= SCENE HELPERS ================= */
  const bubble = document.getElementById("bubble");
  const bubbleName = document.getElementById("bubbleName");
  const bubbleText = document.getElementById("bubbleText");
  const statusEl = document.getElementById("status");
  const setStatus = t => statusEl.textContent = t;
  let hideTimer = null;

  function setActive(g) {
    GIRLS.forEach(o => document.getElementById("g-" + o.id).classList.toggle("active", o === g));
  }
  function showBubble(g, text) {
    clearTimeout(hideTimer);
    bubble.style.left = Math.min(82, Math.max(18, g.x / 10)) + "%";
    bubbleName.textContent = g.am + " · " + g.en;
    bubbleText.textContent = text;            // textContent: safe for AI text
    bubble.classList.add("show");
  }
  function hideBubbleSoon() {
    hideTimer = setTimeout(() => { bubble.classList.remove("show"); setActive(null); }, 4000);
  }
  function setMouth(g, open) {                // open: 0..1
    const el = document.getElementById("g-" + g.id);
    el.querySelector(".openMouth").setAttribute("opacity", open > .12 ? 1 : 0);
    el.querySelector(".lips").setAttribute("opacity", open > .12 ? 0 : 1);
    el.querySelector(".mo").setAttribute("ry", (1.5 + open * 4.5).toFixed(2));
  }

  /* ================= WAVE + LIP SYNC (one animation loop) ================= */
  const wave = { level: 0, listening: false };
  let analyser = null, current = null;      // current = id of the girl talking now
  {
    const cv = document.getElementById("wave"), ctx = cv.getContext("2d");
    let buf = new Uint8Array(1024), t = 0;
    const draw = () => {
      const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
      if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      const mid = H / 2; t += .05;
      ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.beginPath();
      if (current && analyser) {                     // a girl is talking: her real voice
        const g = GIRLS.find(x => x.id === current);
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        ctx.strokeStyle = g.color;
        for (let i = 0; i < buf.length; i++) {
          const d = (buf[i] - 128) / 128; sum += d * d;
          const x = i / (buf.length - 1) * W, y = mid + d * mid * 1.8;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        setMouth(g, Math.min(1, Math.max(0, (Math.sqrt(sum / buf.length) - .02) * 9)));
      } else {                                       // listening: wave follows YOUR voice
        const amp = wave.listening ? 3 + Math.min(1, wave.level * 12) * mid * .9 : 1.5;
        ctx.strokeStyle = wave.listening ? "#5bb04a" : "#6b5544";
        for (let x = 0; x <= W; x += 4) {
          const y = mid + Math.sin(x / 26 + t * 3) * amp * Math.sin(Math.PI * x / W);
          x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
      }
      ctx.stroke();
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  }

  /* ================= LIVE VOICE: talk to Gemini directly ================= */
  // Names as Gemini may write them in its transcript — used as a safety check
  const CALL = {
    enana:     /እናና|ኤናና|እናኒ|\benana\b|\benanna\b/i,
    suzi:      /ሱዚ|ሱዝ|\bsu[zs]+(i|y|ie|ey)\b/i,
    beza:      /ቤዛ|\bbe[zs]+a\b/i,
    tesfanesh: /ተስፋነሽ|ተስፋ|\btesfa(nesh|nish)?\b/i,
  };
  const EVERYONE = /ሁላችሁም|ሁላችሁ|everyone|everybody|all of you/i;

  const micBtn = document.getElementById("micBtn");
  let running = false, sockets = {}, readyCount = 0;
  let micStream = null, micCtx = null, outCtx = null;
  const st = {};                     // per girl: audio queue, text, turn state
  const order = [];                  // girls waiting to talk, in the order they started answering
  let heard = "", heardAt = 0;

  const b64 = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };

  function shouldMute(g) {           // a girl who wasn't called must not talk over the one who was
    if (!heard || EVERYONE.test(heard)) return false;
    const named = GIRLS.filter(x => CALL[x.id].test(heard));
    return named.length > 0 && !named.includes(g);
  }

  function onGemini(g, data) {
    let m; try { m = JSON.parse(data); } catch { return; }
    if (m.ready) {
      if (++readyCount === GIRLS.length) { wave.listening = true; setStatus("Listening… call a name: እናና Enana, ሱዚ Suzi, ቤዛ Beza, ተስፋነሽ Tesfanesh — or ሁላችሁም."); }
      return;
    }
    if (m.error) { setStatus(`${g.en}: ${m.error}. Press Start again.`); return; }
    const sc = m.serverContent; if (!sc) return;
    const s = st[g.id];

    if (sc.inputTranscription?.text && g.id === "enana") {        // what Gemini heard you say
      if (Date.now() - heardAt > 2500) heard = "";
      heard += sc.inputTranscription.text; heardAt = Date.now();
      if (!current) setStatus("👂 " + heard.trim());
    }
    if (sc.interrupted) { s.queue = []; if (current === g.id && !s.sources) finish(g); }
    if (sc.modelTurn?.parts) {
      if (s.turnDone) {                                           // a new answer starts
        s.turnDone = false; s.text = ""; s.muted = shouldMute(g);
        if (!s.muted && !order.includes(g.id)) order.push(g.id);
      }
      if (!s.muted) for (const p of sc.modelTurn.parts) if (p.inlineData?.data) s.queue.push(p.inlineData.data);
    }
    if (sc.outputTranscription?.text && !s.muted) {
      s.text += sc.outputTranscription.text;
      if (current === g.id) showBubble(g, s.text);
    }
    if (sc.turnComplete) s.turnDone = true;
    pump();
  }

  // Play one girl at a time; others wait their turn
  function pump() {
    if (!current) {
      const next = order.find(id => st[id].queue.length);
      if (!next) return;
      current = next;
      const g = GIRLS.find(x => x.id === next);
      setActive(g); showBubble(g, st[next].text || "…");
      setStatus(`${g.am} (${g.en}) is talking…`);
    }
    const g = GIRLS.find(x => x.id === current), s = st[current];
    while (s.queue.length) {
      const bytes = Uint8Array.from(atob(s.queue.shift()), c => c.charCodeAt(0));
      const pcm = new Int16Array(bytes.buffer, 0, bytes.length >> 1);
      const ab = outCtx.createBuffer(1, pcm.length, 24000);
      const ch = ab.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
      const src = outCtx.createBufferSource();
      src.buffer = ab; src.connect(analyser);
      s.nextTime = Math.max(s.nextTime, outCtx.currentTime + .04);
      src.start(s.nextTime); s.nextTime += ab.duration; s.sources++;
      src.onended = () => { s.sources--; if (!s.sources && !s.queue.length && s.turnDone) finish(g); };
    }
    if (!s.sources && !s.queue.length && s.turnDone) finish(g);
  }
  function finish(g) {
    if (current !== g.id) return;
    const s = st[g.id];
    current = null; s.nextTime = 0;
    order.splice(order.indexOf(g.id), 1);
    setMouth(g, 0); hideBubbleSoon();
    heard = "";
    if (running) setStatus("Listening… call a name.");
    pump();                                                       // next girl, if one is waiting
  }

  async function start() {
    running = true; micUI(); readyCount = 0;
    setStatus("Connecting to the girls…");
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    } catch (e) {
      setStatus("Microphone blocked — click the 🎤 icon in Chrome's address bar and allow it."); return stop(false);
    }
    outCtx = new AudioContext(); await outCtx.resume();
    analyser = outCtx.createAnalyser(); analyser.fftSize = 1024; analyser.connect(outCtx.destination);

    const proto = location.protocol === "https:" ? "wss" : "ws";
    for (const g of GIRLS) {
      st[g.id] = { queue: [], text: "", turnDone: true, muted: false, nextTime: 0, sources: 0 };
      const ws = new WebSocket(`${proto}://${location.host}/live?girl=${g.id}`);
      ws.onmessage = ev => onGemini(g, ev.data);
      ws.onclose = () => { if (running && readyCount < GIRLS.length) setStatus(`Couldn't connect ${g.en} — check the codespace terminal.`); };
      sockets[g.id] = ws;
    }

    // Microphone → 16 kHz 16-bit PCM → every girl's socket (every 100 ms)
    micCtx = new AudioContext({ sampleRate: 16000 });
    const worklet = "class P extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('mic',P)";
    await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: "application/javascript" })));
    const node = new AudioWorkletNode(micCtx, "mic");
    let parts = [], len = 0;
    node.port.onmessage = e => {
      parts.push(e.data); len += e.data.length;
      if (len < 1600) return;
      const pcm = new Int16Array(len); let o = 0, sum = 0;
      const quiet = !!current;          // while a girl talks, send silence so they don't hear themselves
      for (const p of parts) for (let i = 0; i < p.length; i++) {
        const v = quiet ? 0 : Math.max(-1, Math.min(1, p[i]));
        sum += p[i] * p[i]; pcm[o++] = v < 0 ? v * 32768 : v * 32767;
      }
      wave.level = quiet ? 0 : Math.sqrt(sum / len);
      parts = []; len = 0;
      const msg = JSON.stringify({ realtimeInput: { audio: { data: b64(new Uint8Array(pcm.buffer)), mimeType: "audio/pcm;rate=16000" } } });
      for (const ws of Object.values(sockets)) if (ws.readyState === 1) ws.send(msg);
    };
    micCtx.createMediaStreamSource(micStream).connect(node);
    node.connect(micCtx.destination);   // keeps the worklet running (it outputs silence)
  }

  function stop(msg = true) {
    running = false; micUI();
    Object.values(sockets).forEach(ws => { try { ws.close(); } catch {} }); sockets = {};
    micStream?.getTracks().forEach(t => t.stop()); micStream = null;
    micCtx?.close(); micCtx = null; outCtx?.close(); outCtx = null; analyser = null;
    if (current) { setMouth(GIRLS.find(x => x.id === current), 0); current = null; }
    order.length = 0; wave.listening = false; wave.level = 0;
    bubble.classList.remove("show"); setActive(null);
    if (msg) setStatus("Stopped. Press Start to talk again.");
  }

  function micUI() {
    micBtn.classList.toggle("on", running);
    micBtn.setAttribute("aria-pressed", running);
    micBtn.textContent = running ? "■ አቁም · Stop" : "▶ ጀምር · Start";
  }
  micBtn.addEventListener("click", () => running ? stop() : start());

  if (!navigator.mediaDevices?.getUserMedia || !window.AudioWorkletNode) {
    micBtn.disabled = true; setStatus("This browser can't do live voice — please use Chrome.");
  }

  setTimeout(() => { setActive(GIRLS[0]); showBubble(GIRLS[0], "እኔ እናና ነኝ። እንኳን ደህና መጡ! ጀምርን ይጫኑ፣ ከዚያ ስማችንን ጠርተው ያውሩን።"); }, 700);
  window.GIRLS = GIRLS;   // handy in the console
}
</script>
</body>
</html>
